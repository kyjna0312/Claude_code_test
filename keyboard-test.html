<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키보드 입력 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            padding: 40px;
            max-width: 1000px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .keyboard-section {
            margin-bottom: 40px;
        }

        .keyboard-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .keyboard-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .key {
            min-width: 40px;
            height: 40px;
            padding: 8px;
            background: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            user-select: none;
            transition: all 0.05s ease;
            position: relative;
            overflow: hidden;
        }

        .key:hover {
            background: #f0f0f0;
            border-color: #bbb;
        }

        .key:active,
        .key.pressed {
            background: #333;
            color: white;
            border-color: #333;
            transform: scale(0.95);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .key.feedback {
            animation: pulse 0.3s ease;
        }

        @keyframes pulse {
            0% {
                background: #333;
                color: white;
                transform: scale(0.95);
            }
            50% {
                transform: scale(1.02);
            }
            100% {
                background: #f8f8f8;
                color: #333;
                transform: scale(1);
            }
        }

        .key-space {
            flex: 1;
            min-width: 300px;
        }

        .stats {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
        }

        .stats-title {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            color: #999;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #333;
            font-size: 24px;
            font-weight: 600;
        }

        .clear-btn {
            display: block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            color: #333;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            width: 100%;
        }

        .clear-btn:hover {
            background: #e0e0e0;
            border-color: #999;
        }

        .clear-btn:active {
            background: #d0d0d0;
        }

        .input-display {
            margin-bottom: 30px;
            padding: 15px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 8px;
            min-height: 50px;
            color: #333;
            font-size: 16px;
            word-break: break-all;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .input-label {
            color: #999;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⌨️ 키보드 입력 테스트</h1>

        <div class="input-display-wrapper">
            <div class="input-label">입력된 키</div>
            <div class="input-display" id="inputDisplay">여기를 클릭하거나 키보드를 입력하세요</div>
        </div>

        <div class="keyboard-section">
            <div class="keyboard-label">숫자</div>
            <div class="keyboard">
                <div class="keyboard-row" id="numberRow"></div>
            </div>
        </div>

        <div class="keyboard-section">
            <div class="keyboard-label">QWERTY</div>
            <div class="keyboard">
                <div class="keyboard-row" id="qwertyRow1"></div>
                <div class="keyboard-row" id="qwertyRow2"></div>
                <div class="keyboard-row" id="qwertyRow3"></div>
            </div>
        </div>

        <div class="keyboard-section">
            <div class="keyboard-label">스페이스</div>
            <div class="keyboard">
                <div class="keyboard-row">
                    <div class="key key-space" data-key=" ">Space</div>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stats-title">통계</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">입력된 키</div>
                    <div class="stat-value" id="totalKeys">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">가장 많이 누른 키</div>
                    <div class="stat-value" id="topKey">-</div>
                </div>
            </div>
            <button class="clear-btn" onclick="clearStats()">초기화</button>
        </div>
    </div>

    <script>
        const numberKeys = '1234567890';
        const qwertyRow1 = 'qwertyuiop';
        const qwertyRow2 = 'asdfghjkl';
        const qwertyRow3 = 'zxcvbnm';

        const keyStats = {};
        let inputText = '';

        function createKeyboard() {
            const numberRow = document.getElementById('numberRow');
            const row1 = document.getElementById('qwertyRow1');
            const row2 = document.getElementById('qwertyRow2');
            const row3 = document.getElementById('qwertyRow3');

            // 숫자 키 생성
            numberKeys.split('').forEach(char => {
                numberRow.appendChild(createKeyElement(char));
            });

            // QWERTY 행 생성
            qwertyRow1.split('').forEach(char => {
                row1.appendChild(createKeyElement(char.toUpperCase()));
            });

            qwertyRow2.split('').forEach(char => {
                row2.appendChild(createKeyElement(char.toUpperCase()));
            });

            qwertyRow3.split('').forEach(char => {
                row3.appendChild(createKeyElement(char.toUpperCase()));
            });
        }

        function createKeyElement(char) {
            const key = document.createElement('div');
            key.className = 'key';
            key.textContent = char;
            key.setAttribute('data-key', char.toLowerCase());

            key.addEventListener('click', () => {
                handleKeyPress(char.toLowerCase());
            });

            key.addEventListener('mousedown', () => {
                key.classList.add('pressed');
            });

            key.addEventListener('mouseup', () => {
                key.classList.remove('pressed');
            });

            key.addEventListener('mouseleave', () => {
                key.classList.remove('pressed');
            });

            return key;
        }

        function handleKeyPress(char) {
            inputText += char;
            updateDisplay();
            updateStats(char);
            animateKey(char);
        }

        function updateDisplay() {
            const display = document.getElementById('inputDisplay');
            if (inputText) {
                display.textContent = inputText;
            }
        }

        function updateStats(char) {
            keyStats[char] = (keyStats[char] || 0) + 1;
            document.getElementById('totalKeys').textContent = Object.values(keyStats).reduce((a, b) => a + b, 0);

            const topKey = Object.entries(keyStats).reduce((a, b) => b[1] > a[1] ? b : a);
            document.getElementById('topKey').textContent = topKey[0].toUpperCase();
        }

        function animateKey(char) {
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                if (key.getAttribute('data-key') === char) {
                    key.classList.add('feedback');
                    setTimeout(() => key.classList.remove('feedback'), 300);
                }
            });
        }

        function clearStats() {
            Object.keys(keyStats).forEach(key => delete keyStats[key]);
            inputText = '';
            document.getElementById('inputDisplay').textContent = '여기를 클릭하거나 키보드를 입력하세요';
            document.getElementById('totalKeys').textContent = '0';
            document.getElementById('topKey').textContent = '-';
        }

        // 실제 키보드 입력 감지
        document.addEventListener('keydown', (e) => {
            const char = e.key.toLowerCase();
            if (/^[a-z0-9 ]$/.test(char)) {
                handleKeyPress(char);
            }
        });

        // 초기화
        createKeyboard();
    </script>
</body>
</html>
