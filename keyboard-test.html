<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키보드 입력 테스트</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
            --bg-color: #ffffff;
            --text-color: #333333;
            --text-light: #666666;
            --text-lighter: #999999;
            --border-color: #dddddd;
            --border-light: #eeeeee;
            --key-bg: #f8f8f8;
            --key-hover: #f0f0f0;
            --key-active: #333333;
            --key-active-text: #ffffff;
            --input-bg: #fafafa;
            --stats-bg: #f9f9f9;
            --shadow: rgba(0, 0, 0, 0.08);
            --shadow-dark: rgba(0, 0, 0, 0.2);
            --transition: 0.3s ease;
        }

        body.dark-mode {
            --bg-gradient: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            --bg-color: #1e1e1e;
            --text-color: #e0e0e0;
            --text-light: #b0b0b0;
            --text-lighter: #808080;
            --border-color: #404040;
            --border-light: #333333;
            --key-bg: #2a2a2a;
            --key-hover: #333333;
            --key-active: #e0e0e0;
            --key-active-text: #1e1e1e;
            --input-bg: #262626;
            --stats-bg: #242424;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-dark: rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background var(--transition), color var(--transition);
        }

        .header {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .theme-toggle {
            background: var(--key-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
            color: var(--text-color);
        }

        .theme-toggle:hover {
            background: var(--key-hover);
            transform: scale(1.1);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .container {
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 10px 40px var(--shadow);
            padding: 40px;
            max-width: 1000px;
            width: 100%;
            transition: background var(--transition), box-shadow var(--transition);
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
            transition: color var(--transition);
        }

        .keyboard-section {
            margin-bottom: 40px;
        }

        .keyboard-label {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
            transition: color var(--transition);
        }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .keyboard-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .key {
            min-width: 40px;
            height: 40px;
            padding: 8px;
            background: var(--key-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-color);
            user-select: none;
            transition: all 0.05s ease;
            position: relative;
            overflow: hidden;
        }

        .key:hover {
            background: var(--key-hover);
            border-color: var(--text-light);
        }

        .key:active,
        .key.pressed {
            background: var(--key-active);
            color: var(--key-active-text);
            border-color: var(--key-active);
            transform: scale(0.95);
            box-shadow: inset 0 2px 4px var(--shadow-dark);
        }

        .key.feedback {
            animation: pulse 0.3s ease;
        }

        @keyframes pulse {
            0% {
                background: var(--key-active);
                color: var(--key-active-text);
                transform: scale(0.95);
            }
            50% {
                transform: scale(1.02);
            }
            100% {
                background: var(--key-bg);
                color: var(--text-color);
                transform: scale(1);
            }
        }

        .key-space {
            flex: 1;
            min-width: 300px;
        }

        .stats {
            background: var(--stats-bg);
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
            transition: background var(--transition);
        }

        .stats-title {
            color: var(--text-light);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
            margin-bottom: 15px;
            transition: color var(--transition);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            color: var(--text-lighter);
            font-size: 12px;
            margin-bottom: 5px;
            transition: color var(--transition);
        }

        .stat-value {
            color: var(--text-color);
            font-size: 24px;
            font-weight: 600;
            transition: color var(--transition);
        }

        .clear-btn {
            display: block;
            margin-top: 20px;
            padding: 10px 20px;
            background: var(--key-hover);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-color);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            width: 100%;
        }

        .clear-btn:hover {
            background: var(--key-active);
            color: var(--key-active-text);
            border-color: var(--key-active);
        }

        .clear-btn:active {
            opacity: 0.8;
        }

        .input-display {
            margin-bottom: 30px;
            padding: 15px;
            background: var(--input-bg);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            min-height: 50px;
            color: var(--text-color);
            font-size: 16px;
            word-break: break-all;
            font-family: 'Monaco', 'Courier New', monospace;
            transition: background var(--transition), color var(--transition);
        }

        .input-label {
            color: var(--text-lighter);
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color var(--transition);
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="theme-toggle" id="themeToggle" title="다크모드 전환">🌙</button>
    </div>

    <div class="container">
        <h1>⌨️ 키보드 입력 테스트</h1>

        <div class="input-display-wrapper">
            <div class="input-label">입력된 키</div>
            <div class="input-display" id="inputDisplay">여기를 클릭하거나 키보드를 입력하세요</div>
        </div>

        <div class="keyboard-section">
            <div class="keyboard-label">숫자</div>
            <div class="keyboard">
                <div class="keyboard-row" id="numberRow"></div>
            </div>
        </div>

        <div class="keyboard-section">
            <div class="keyboard-label">QWERTY</div>
            <div class="keyboard">
                <div class="keyboard-row" id="qwertyRow1"></div>
                <div class="keyboard-row" id="qwertyRow2"></div>
                <div class="keyboard-row" id="qwertyRow3"></div>
            </div>
        </div>

        <div class="keyboard-section">
            <div class="keyboard-label">스페이스</div>
            <div class="keyboard">
                <div class="keyboard-row">
                    <div class="key key-space" data-key=" ">Space</div>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stats-title">통계</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">입력된 키</div>
                    <div class="stat-value" id="totalKeys">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">가장 많이 누른 키</div>
                    <div class="stat-value" id="topKey">-</div>
                </div>
            </div>
            <button class="clear-btn" onclick="clearStats()">초기화</button>
        </div>
    </div>

    <script>
        const numberKeys = '1234567890';
        const qwertyRow1 = 'qwertyuiop';
        const qwertyRow2 = 'asdfghjkl';
        const qwertyRow3 = 'zxcvbnm';

        const keyStats = {};
        let inputText = '';
        let isDarkMode = false;

        function initTheme() {
            const savedTheme = localStorage.getItem('theme-preference');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            isDarkMode = savedTheme ? savedTheme === 'dark' : prefersDark;
            applyTheme();
            updateToggleButton();
        }

        function applyTheme() {
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
            localStorage.setItem('theme-preference', isDarkMode ? 'dark' : 'light');
        }

        function updateToggleButton() {
            const button = document.getElementById('themeToggle');
            button.textContent = isDarkMode ? '☀️' : '🌙';
            button.title = isDarkMode ? '라이트모드 전환' : '다크모드 전환';
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            applyTheme();
            updateToggleButton();
        }

        function createKeyboard() {
            const numberRow = document.getElementById('numberRow');
            const row1 = document.getElementById('qwertyRow1');
            const row2 = document.getElementById('qwertyRow2');
            const row3 = document.getElementById('qwertyRow3');

            // 숫자 키 생성
            numberKeys.split('').forEach(char => {
                numberRow.appendChild(createKeyElement(char));
            });

            // QWERTY 행 생성
            qwertyRow1.split('').forEach(char => {
                row1.appendChild(createKeyElement(char.toUpperCase()));
            });

            qwertyRow2.split('').forEach(char => {
                row2.appendChild(createKeyElement(char.toUpperCase()));
            });

            qwertyRow3.split('').forEach(char => {
                row3.appendChild(createKeyElement(char.toUpperCase()));
            });
        }

        function createKeyElement(char) {
            const key = document.createElement('div');
            key.className = 'key';
            key.textContent = char;
            key.setAttribute('data-key', char.toLowerCase());

            key.addEventListener('click', () => {
                handleKeyPress(char.toLowerCase());
            });

            key.addEventListener('mousedown', () => {
                key.classList.add('pressed');
            });

            key.addEventListener('mouseup', () => {
                key.classList.remove('pressed');
            });

            key.addEventListener('mouseleave', () => {
                key.classList.remove('pressed');
            });

            return key;
        }

        function handleKeyPress(char) {
            inputText += char;
            updateDisplay();
            updateStats(char);
            animateKey(char);
        }

        function updateDisplay() {
            const display = document.getElementById('inputDisplay');
            if (inputText) {
                display.textContent = inputText;
            }
        }

        function updateStats(char) {
            keyStats[char] = (keyStats[char] || 0) + 1;
            document.getElementById('totalKeys').textContent = Object.values(keyStats).reduce((a, b) => a + b, 0);

            const topKey = Object.entries(keyStats).reduce((a, b) => b[1] > a[1] ? b : a);
            document.getElementById('topKey').textContent = topKey[0].toUpperCase();
        }

        function animateKey(char) {
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                if (key.getAttribute('data-key') === char) {
                    key.classList.add('feedback');
                    setTimeout(() => key.classList.remove('feedback'), 300);
                }
            });
        }

        function clearStats() {
            Object.keys(keyStats).forEach(key => delete keyStats[key]);
            inputText = '';
            document.getElementById('inputDisplay').textContent = '여기를 클릭하거나 키보드를 입력하세요';
            document.getElementById('totalKeys').textContent = '0';
            document.getElementById('topKey').textContent = '-';
        }

        // 실제 키보드 입력 감지
        document.addEventListener('keydown', (e) => {
            const char = e.key.toLowerCase();
            if (/^[a-z0-9 ]$/.test(char)) {
                handleKeyPress(char);
            }
        });

        // 테마 토글 버튼 이벤트
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        // 초기화
        initTheme();
        createKeyboard();
    </script>
</body>
</html>
